<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetterMoodle Oldalsó Panel</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <!-- Top Primary Bar (<= 52px) -->
  <header class="sp-topbar" aria-label="Oldalsó panel fő vezérlők">
    <div class="sp-brand">
      <span class="monogram" aria-hidden="true">
        <svg width="16" height="16" viewBox="16 24 100 82" fill="none" aria-hidden="true">
          <path d="M 26 80 V 38 L 50 62 L 74 38 V 80" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M 97 34 V 56 M 86 45 H 108" stroke="var(--accent, #3b82f6)" stroke-width="10" stroke-linecap="round" />
          <path d="M 26 97 H 102" stroke="var(--accent, #3b82f6)" stroke-width="6" stroke-linecap="round" />
        </svg>
      </span>
      <div class="sp-brand-info">
        <span class="sp-title" title="BetterMoodle Munkaterület">BetterMoodle</span>
        <span class="sp-host">
          <span class="status-dot" id="spStatusDot" aria-hidden="true"></span>
          <span class="sp-host-text" id="spHostText" title="Nincs aktív Moodle oldal">Nincs Moodle oldal</span>
        </span>
      </div>
    </div>

    <div class="sp-top-actions">
      <button type="button" class="btn-compact" id="spRescanBtn" title="Aktív oldal médiafájljainak frissítése" aria-label="Aktív oldal médiafájljainak frissítése">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10" />
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
        </svg>
        <span>Keresés</span>
      </button>
      <button type="button" class="btn-icon" id="spSignOutBtn" title="Kijelentkezés a Moodle fiókból" aria-label="Kijelentkezés a Moodle fiókból" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
      <a
        href="https://github.com/CsPS0/BetterMoodle"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-icon"
        style="text-decoration:none;"
        title="BetterMoodle a GitHubon"
        aria-label="BetterMoodle a GitHubon"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07 1 2.24 1 3.44C21 17.9 16.97 21 12 21s-9-3.1-9-7.56c0-1.25.5-2.4 1-3.44 0 0-1.89-6.42-.5-7 1.39-.58 4.72.23 6.5 2.23A9.04 9.04 0 0 1 12 5Z" />
          <path d="M8 14v.5" />
          <path d="M16 14v.5" />
          <path d="M11.25 16.25h1.5L12 17l-.75-.75Z" />
        </svg>
      </a>
      <button type="button" class="btn-icon" id="spOptionsBtn" title="Teljes beállítások megnyitása" aria-label="Teljes beállítások megnyitása">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Live Detected Media & Files -->
  <section class="sp-section" aria-label="Aktív lapon észlelt média és fájlok">
    <div class="sp-section-hdr">
      <h2 class="sp-section-title">Aktív Média és Fájlok</h2>
      <span class="count-badge tabular" id="spMediaCount">0</span>
    </div>
    <div class="list-group list-scroll" id="spMediaList" role="list"></div>
  </section>

  <!-- Filterable Course Switcher -->
  <section class="sp-section" aria-label="Kurzusváltó">
    <div class="sp-section-hdr">
      <h2 class="sp-section-title">Kurzusok</h2>
      <span class="count-badge tabular" id="spCourseCount">0</span>
    </div>
    <div class="search-box">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input
        type="text"
        id="spCourseSearch"
        class="search-input"
        placeholder="Kurzusok szűrése..."
        aria-label="Kurzusok szűrése"
      />
    </div>
    <div class="list-group list-scroll" id="spCourseList" role="list"></div>
  </section>

  <!-- Upcoming Deadlines -->
  <section class="sp-section" aria-label="Közelgő határidők">
    <div class="sp-section-hdr">
      <h2 class="sp-section-title">Közelgő Határidők</h2>
      <span class="count-badge tabular" id="spDeadlineCount">0</span>
    </div>
    <div class="list-group list-scroll" id="spDeadlineList" role="list"></div>
  </section>

  <footer class="sp-footer">
    <span><kbd>Alt+Shift+K</kbd> Testreszabás</span>
    <span><kbd>Alt+Shift+D</kbd> Letöltés</span>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
